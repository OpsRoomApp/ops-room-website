services:
  opsroom-website:
    build:
      context: .
      dockerfile: Dockerfile
      # Umami tracker id is baked into the JS bundle at build time (Vite),
      # so it must be a build arg, not a runtime env var. Set it in .env
      # once the Umami website exists; empty = no tracker in the build.
      args:
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
    container_name: opsroom-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_PAYMENT_ENABLED=false
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/opsroom/certbot:/opt/opsroom/certbot
      - /opt/opsroom-releases:/opt/opsroom-releases:ro
    networks:
      - opsroom-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    container_name: opsroom-admin-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-https://admin.opsroom.live/api/auth/callback}
      - APPROVED_GITHUB_USERS=${APPROVED_GITHUB_USERS:-}
      # Discord OAuth (C3) -- parallel login path, allowlisted by Discord user ID
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://admin.opsroom.live/api/auth/discord/callback}
      - DISCORD_APP_CONNECT_REDIRECT_URI=${DISCORD_APP_CONNECT_REDIRECT_URI:-https://admin.opsroom.live/api/community/connect/callback}
      - COMMUNITY_EVENT_TOKEN=${COMMUNITY_EVENT_TOKEN:-}
      - APPROVED_DISCORD_USERS=${APPROVED_DISCORD_USERS:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
      # FAA NMS-API NOTAM proxy (v0.25.60). Credentials live only on this server.
      - NMS_CLIENT_KEY=${NMS_CLIENT_KEY:-}
      - NMS_CLIENT_SECRET=${NMS_CLIENT_SECRET:-}
      - NMS_ENVIRONMENT=${NMS_ENVIRONMENT:-staging}
      - NMS_BASE_URL=${NMS_BASE_URL:-}
      - NMS_API_TOKEN=${NMS_API_TOKEN:-}
      # OpenAIP airspace proxy (map enrichment). Key lives only on this server.
      - OPENAIP_API_KEY=${OPENAIP_API_KEY:-}
      - OPENAIP_PROXY_TOKEN=${OPENAIP_PROXY_TOKEN:-}
      # NOTAM ingest-to-DB pipeline (v0.25.63): dedicated SQLite store refreshed
      # by 1 bulk pull / 24h + 1 incremental pull / 3 min; per-airport requests
      # are served from SQL so FAA quota is constant regardless of userbase.
      - NOTAMS_DB_PATH=/opt/opsroom-notams/notams.db
      # RainViewer precipitation tile cache (server-cached proxy, v0.25.80).
      - RAINVIEWER_CACHE_DIR=/opt/opsroom-rainviewer
      - NMS_INGEST_ENABLED=${NMS_INGEST_ENABLED:-1}
      - NOTAM_CLASSIFICATION=${NOTAM_CLASSIFICATION:-}
      - ANALYTICS_SALT=${ANALYTICS_SALT:-${JWT_SECRET:-}}
      - OPSROOM_RELEASES_DIR=/opt/opsroom-releases
      - RATE_LIMIT_LOGIN_PER_MIN=${RATE_LIMIT_LOGIN_PER_MIN:-10}
      - RATE_LIMIT_UPLOAD_PER_MIN=${RATE_LIMIT_UPLOAD_PER_MIN:-5}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
      # Hosted ticket transcripts (B1/C1): retention + bot bearer token + storage dir.
      - TRANSCRIPT_RETENTION_DAYS=${TRANSCRIPT_RETENTION_DAYS:-14}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - TRANSCRIPT_STORAGE_PATH=/opt/opsroom-transcripts
      # Bug reports (v0.25.x): SQLite DB + diagnostics ZIPs received from the
      # desktop app's in-app Report Bug flow. The secret default matches the
      # value shipped in the desktop binary (app/bug_report.py DEFAULT_SECRET).
      - BUG_REPORT_SECRET=${BUG_REPORT_SECRET:-e7eb1adf7e094220a3f5ad89fcf6d01ce4194a0fe4b2452f9415b97d808bbbab}
      - BUG_REPORTS_DB=/opt/opsroom-bug-reports/bug_reports.sqlite3
      - BUG_REPORTS_STORAGE_DIR=/opt/opsroom-bug-reports
      - BUG_REPORTS_RATE_LIMIT_PER_MIN=${BUG_REPORTS_RATE_LIMIT_PER_MIN:-10}
      # Website support form (v0.25.x): public /support contact form messages.
      - SUPPORT_DB=/opt/opsroom-support/support.sqlite3
      - SUPPORT_RATE_LIMIT_PER_MIN=${SUPPORT_RATE_LIMIT_PER_MIN:-5}
      # flightsim.to social-proof badge (v0.25.x). Optional; without a key the
      # homepage badge shows a plain link instead of live stats.
      - FLIGHTSIM_API_KEY=${FLIGHTSIM_API_KEY:-}
      - FLIGHTSIM_ADDON_ID=${FLIGHTSIM_ADDON_ID:-}
      - FLIGHTSIM_ADDON_URL=${FLIGHTSIM_ADDON_URL:-}
      - FLIGHTSIM_STATS_URL=${FLIGHTSIM_STATS_URL:-}
      # Umami website analytics bridge (v0.25.x): read-only stats for the
      # admin panel Analytics page. Talks to the umami sibling container
      # over the docker network; empty credentials = not configured.
      - UMAMI_API_URL=http://umami:3000
      - UMAMI_USERNAME=${UMAMI_USERNAME:-}
      - UMAMI_PASSWORD=${UMAMI_PASSWORD:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      # Discord release notifications (v0.25.x): incoming webhooks fired from
      # publish_release. DISCORD_RELEASE_WEBHOOK_URL posts the formatted release
      # note to #release-notes; DISCORD_DOWNLOADS_WEBHOOK_URL posts the direct
      # download links to #downloads. Empty = that post is disabled.
      - DISCORD_RELEASE_WEBHOOK_URL=${DISCORD_RELEASE_WEBHOOK_URL:-}
      - DISCORD_DOWNLOADS_WEBHOOK_URL=${DISCORD_DOWNLOADS_WEBHOOK_URL:-}
      # Path to the OPS CONTROL bot SQLite database. When set, the Discord
      # admin endpoints read live bot data. Optional -- the API starts
      # without it and reports the bot database as unavailable.
      - OPS_CONTROL_DB=/ops-control-data/ops-control.db
    volumes:
      - /opt/opsroom-releases:/opt/opsroom-releases
      - admin-logs:/var/log
      # Shared OPS CONTROL bot SQLite database (same volume the bot uses).
      - /opt/ops-control-bot/data:/ops-control-data
      # Hosted ticket transcript storage (B1/C1). Written by the admin-api
      # and served by the public transcript viewer via the nginx proxy.
      - /opt/opsroom-transcripts:/opt/opsroom-transcripts
      # Dedicated NOTAM database (v0.25.63), separate from the bot DB.
      - /opt/opsroom-notams:/opt/opsroom-notams
      # RainViewer precipitation tile cache (server-cached proxy, v0.25.80).
      - /opt/opsroom-rainviewer:/opt/opsroom-rainviewer
      # Bug report storage: SQLite DB + diagnostics ZIPs (v0.25.x).
      - /opt/opsroom-bug-reports:/opt/opsroom-bug-reports
      # Website support form storage (v0.25.x).
      - /opt/opsroom-support:/opt/opsroom-support
    networks:
      - opsroom-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Self-hosted Umami analytics (v0.25.x): cookieless, GDPR-friendly, no
  # consent banner needed on the public site. The tracker script and its
  # ingest endpoint are proxied same-origin by nginx (opsroom.live/script.js
  # and /api/send); v2.19.0 serves the tracker at /script.js (the old
  # /umami.js path redirects). The dashboard binds to localhost only and is
  # reached via SSH tunnel or through the admin panel Analytics page
  # (admin-api bridge). First-run setup: create the admin account + the
  # opsroom.live website once, then fill UMAMI_USERNAME/PASSWORD/WEBSITE_ID
  # in .env (see DEPLOYMENT_UMAMI.md).
  #
  # PINNED to postgresql-v2.19.0 (final v2 release): `postgresql-latest`
  # now resolves to Umami v3, whose REST API changed (no /api/auth/setup,
  # new login/websites/stats shapes) and breaks the admin-api bridge and
  # the setup flow in DEPLOYMENT_UMAMI.md. v2.19.0 is what everything here
  # was built and tested against. Revisit when the bridge is ported to v3.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    container_name: opsroom-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - opsroom-net

  umami-db:
    image: postgres:16-alpine
    container_name: opsroom-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - opsroom-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

networks:
  opsroom-net:
    driver: bridge

volumes:
  admin-logs:
  umami-db-data:
