services:
  opsroom-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsroom-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_PAYMENT_ENABLED=false
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/opsroom/certbot:/opt/opsroom/certbot
      - /opt/opsroom-releases:/opt/opsroom-releases:ro
    networks:
      - opsroom-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    container_name: opsroom-admin-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-https://admin.opsroom.live/api/auth/callback}
      - APPROVED_GITHUB_USERS=${APPROVED_GITHUB_USERS:-}
      # Discord OAuth (C3) -- parallel login path, allowlisted by Discord user ID
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://admin.opsroom.live/api/auth/discord/callback}
      - APPROVED_DISCORD_USERS=${APPROVED_DISCORD_USERS:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
      # FAA NMS-API NOTAM proxy (v0.25.60). Credentials live only on this server.
      - NMS_CLIENT_KEY=${NMS_CLIENT_KEY:-}
      - NMS_CLIENT_SECRET=${NMS_CLIENT_SECRET:-}
      - NMS_ENVIRONMENT=${NMS_ENVIRONMENT:-staging}
      - NMS_BASE_URL=${NMS_BASE_URL:-}
      - NMS_API_TOKEN=${NMS_API_TOKEN:-}
      # OpenAIP airspace proxy (map enrichment). Key lives only on this server.
      - OPENAIP_API_KEY=${OPENAIP_API_KEY:-}
      - OPENAIP_PROXY_TOKEN=${OPENAIP_PROXY_TOKEN:-}
      # NOTAM ingest-to-DB pipeline (v0.25.63): dedicated SQLite store refreshed
      # by 1 bulk pull / 24h + 1 incremental pull / 3 min; per-airport requests
      # are served from SQL so FAA quota is constant regardless of userbase.
      - NOTAMS_DB_PATH=/opt/opsroom-notams/notams.db
      - NMS_INGEST_ENABLED=${NMS_INGEST_ENABLED:-1}
      - NOTAM_CLASSIFICATION=${NOTAM_CLASSIFICATION:-}
      - ANALYTICS_SALT=${ANALYTICS_SALT:-${JWT_SECRET:-}}
      - OPSROOM_RELEASES_DIR=/opt/opsroom-releases
      - RATE_LIMIT_LOGIN_PER_MIN=${RATE_LIMIT_LOGIN_PER_MIN:-10}
      - RATE_LIMIT_UPLOAD_PER_MIN=${RATE_LIMIT_UPLOAD_PER_MIN:-5}
      - ANALYTICS_RETENTION_DAYS=${ANALYTICS_RETENTION_DAYS:-90}
      # Hosted ticket transcripts (B1/C1): retention + bot bearer token + storage dir.
      - TRANSCRIPT_RETENTION_DAYS=${TRANSCRIPT_RETENTION_DAYS:-14}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - TRANSCRIPT_STORAGE_PATH=/opt/opsroom-transcripts
      # Path to the OPS CONTROL bot SQLite database. When set, the Discord
      # admin endpoints read live bot data. Optional -- the API starts
      # without it and reports the bot database as unavailable.
      - OPS_CONTROL_DB=/ops-control-data/ops-control.db
    volumes:
      - /opt/opsroom-releases:/opt/opsroom-releases
      - admin-logs:/var/log
      # Shared OPS CONTROL bot SQLite database (same volume the bot uses).
      - /opt/ops-control-bot/data:/ops-control-data
      # Hosted ticket transcript storage (B1/C1). Written by the admin-api
      # and served by the public transcript viewer via the nginx proxy.
      - /opt/opsroom-transcripts:/opt/opsroom-transcripts
      # Dedicated NOTAM database (v0.25.63), separate from the bot DB.
      - /opt/opsroom-notams:/opt/opsroom-notams
    networks:
      - opsroom-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  opsroom-net:
    driver: bridge

volumes:
  admin-logs:
