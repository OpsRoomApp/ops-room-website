# HTTP redirect server — main site
server {
    listen 80;
    server_name opsroom.live www.opsroom.live;

    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP redirect server — admin
server {
    listen 80;
    server_name admin.opsroom.live;

    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main website
server {
    listen 443 ssl;
    server_name opsroom.live www.opsroom.live;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }

    
    location = /api/update.json {
        alias /opt/opsroom-releases/update.json;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;

        default_type application/json;
    }
    

    location /downloads/ {
        alias /opt/opsroom-releases/;

        types {
            application/zip zip;
        }

        add_header Cache-Control "public, max-age=3600" always;
        autoindex off;

        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public endpoints proxied to the admin-api (hosted ticket transcripts,
    # public appeal submissions). Only these public routes are exposed on the
    # main site; everything else stays behind admin.opsroom.live.
    location /api/v1/transcripts/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/appeals/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
    }
}

# HTTPS admin panel
#
# SSL cert: extend the existing cert to include admin.opsroom.live:
#   certbot --nginx -d opsroom.live -d www.opsroom.live -d admin.opsroom.live
# or use a wildcard cert covering *.opsroom.live.
server {
    listen 443 ssl;
    server_name admin.opsroom.live;

    root /usr/share/nginx/html/admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 600m;
    }

    # Cache admin static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback for admin
    location / {
        try_files $uri $uri/ /index.html;
    }
}
