server {
    listen 80;
    server_name opsroom.live;
    root /usr/share/nginx/html;
    index index.html;


# Redirect HTTP to HTTPS
# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name opsroom.live www.opsroom.live;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    # Everything else goes to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS website
server {
    listen 443 ssl;
    server_name opsroom.live www.opsroom.live;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;


    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
