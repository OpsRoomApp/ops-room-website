# HTTP redirect server
server {
    listen 80;
    server_name opsroom.live www.opsroom.live;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    # Everything else goes to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS website
server {
    listen 443 ssl;
    server_name opsroom.live www.opsroom.live;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }

    # Update manifest API.
    # try_files is used instead of alias with a file target to avoid edge
    # cases with certain nginx builds. OPTIONS is handled explicitly so CORS
    # preflight returns a clean 204 rather than trying to serve the JSON file.
    location = /api/update.json {
        if ($request_method = "OPTIONS") {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "no-cache" always;
            return 204;
        }
        try_files /opt/opsroom-releases/update.json =404;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
    }

    # Release downloads directory.
    # The latest symlink (e.g. latest -> OPS_ROOM_v0_25_13_Public_Windows_x64.zip)
    # lets /downloads/latest always serve the current release without a website
    # rebuild. Explicit types block ensures correct Content-Type for ZIP files.
    location /downloads/ {
        alias /opt/opsroom-releases/;
        types {
            application/zip zip;
        }
        add_header Cache-Control "public, max-age=3600" always;
        autoindex off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
