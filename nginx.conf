# Real client IPs behind Cloudflare (v0.25.61).
# Cloudflare proxies all traffic and sends the visitor's real IP in the
# CF-Connecting-IP header. Trust only Cloudflare's published edge ranges;
# anything else that connects (direct-to-origin, bots) keeps its socket IP.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# RainViewer precipitation tile proxy cache (v0.25.80). Tile URIs are
# keyed by the frame hash, so once a tile is cached nginx serves it directly
# without touching the app process or RainViewer. 4h inactivity matches the
# server-side frame retention (3h) with margin.
proxy_cache_path /var/cache/nginx/rainviewer levels=1:2 keys_zone=rainviewer:10m max_size=2g inactive=4h use_temp_path=off;

# HTTP redirect server - main site
server {
    listen 80;
    server_name opsroom.live www.opsroom.live;

    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP redirect server - admin
server {
    listen 80;
    server_name admin.opsroom.live;

    location /.well-known/acme-challenge/ {
        root /opt/opsroom/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main website
server {
    listen 443 ssl;
    server_name opsroom.live www.opsroom.live;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }

    
    location = /api/update.json {
        alias /opt/opsroom-releases/update.json;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;

        default_type application/json;
    }
    

    location /downloads/ {
        alias /opt/opsroom-releases/;

        types {
            application/zip zip;
        }

        add_header Cache-Control "public, max-age=3600" always;
        autoindex off;

        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public endpoints proxied to the admin-api (hosted ticket transcripts,
    # public appeal submissions). Only these public routes are exposed on the
    # main site; everything else stays behind admin.opsroom.live.
    location /api/v1/transcripts/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/appeals/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website support form (v0.25.x). Public POST from /support; the admin
    # review endpoints behind it are OAuth-gated inside the admin-api. ^~
    # matches both /api/v1/support and /api/v1/support/... before the regex
    # static-asset block.
    location ^~ /api/v1/support {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # flightsim.to social-proof badge (v0.25.x). Public, read-only, cached
    # server-side (6h) -- never cached at the edge so the website always gets
    # a fresh answer after a badge update.
    location = /api/v1/flightsim/stats {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    # Download-count analytics (v0.25.x). Same-origin POST from the /download
    # page so the public JS bundle never references the admin subdomain; the
    # admin-api records the count in its download ledger.
    location = /api/analytics/record {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 15s;
    }

    # Self-hosted Umami analytics (v0.25.x, cookieless). The tracker script
    # and its ingest endpoint are proxied same-origin so visitors never leave
    # opsroom.live and the script stays immune to ad-blockers. Exact-match
    # locations win over the js/css regex below. The Umami dashboard itself
    # binds to localhost on the VPS and is not exposed publicly.
    #
    # Umami v2.19.0 serves the tracker at /script.js (renamed in the v2 line
    # so ad-blockers don't recognize /umami.js). The old /umami.js path is
    # kept as a redirect so stale pages referencing it don't 404.
    location = /script.js {
        proxy_pass http://umami:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /umami.js {
        return 301 /script.js;
    }

    location = /api/send {
        proxy_pass http://umami:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # FAA NMS-API NOTAM proxy (v0.25.60). Shared-token gated inside the
    # admin-api; this location only forwards to the container.
    location /api/v1/nms/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # OpenAIP airspace proxy (map enrichment). Forwards to the admin-api
    # container like the NMS proxy; 60s read timeout covers upstream fetches.
    location /api/v1/openaip/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # RainViewer frame status (v0.25.80). MUST NOT be cached -- the map
    # client polls this every 60s to detect frame rollovers; a cached
    # response would hide rollovers and keep clients on stale tiles.
    location = /api/v1/rainviewer/status {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    # RainViewer precipitation tiles (server-cached proxy, v0.25.80). Repeat
    # tile requests are served straight from the nginx proxy_cache below --
    # the app process (and RainViewer) is only hit on a cache miss. Tile URIs
    # embed the frame hash, so a frame rollover naturally produces new cache
    # keys instead of stale cached tiles. ^~ stops the static-asset regex
    # (.*\.png$) from shadowing this route -- without it, nginx serves its
    # own 404 for every tile because the URL ends in .png.
    location ^~ /api/v1/rainviewer/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache rainviewer;
        proxy_cache_methods GET;   # HEAD must not cache/clobber GET entries
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_bypass $http_x_opsroom_cache_bypass;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # DB-backed NOTAM serving endpoints (v0.25.63). Public, read-only
    # aviation safety data served from the server-side NOTAM store.
    location /api/v1/notams/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Community flight feed + leaderboard (public, read-only). Served to the
    # website homepage and /leaderboard. The live feed must not be cached --
    # clients poll it and a cached response would show stale flights.
    location /api/community/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    # Public release history (v0.25.x). Read by the website changelog and the
    # Discord bot (/latest + /changelog). Serves only published/archived
    # catalog entries with markdown notes -- never drafts or testing builds.
    # Exact-match so the static-asset regex can never shadow it.
    location = /api/public/releases {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
    }
}

# HTTPS admin panel
#
# SSL cert: extend the existing cert to include admin.opsroom.live:
#   certbot --nginx -d opsroom.live -d www.opsroom.live -d admin.opsroom.live
# or use a wildcard cert covering *.opsroom.live.
server {
    listen 443 ssl;
    server_name admin.opsroom.live;

    root /usr/share/nginx/html/admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/opsroom.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsroom.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy API requests to the FastAPI backend. Also serves the desktop app's
    # bug-report ingest POST /api/v1/bug-reports; client_max_body_size 600m
    # comfortably exceeds the ~11 MB base64 diagnostics payload (the API enforces
    # its own 8 MB decoded ZIP cap).
    location /api/ {
        proxy_pass http://admin-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 600m;
    }

    # Cache admin static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback for admin
    location / {
        try_files $uri $uri/ /index.html;
    }
}
